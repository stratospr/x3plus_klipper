[gcode_macro NOZZLE_WIPE]
description: Wipe nozzle on silicone comb (center-based + zigzag)

# Comb parameters
variable_comb_x: 245.0        ; X center of the comb
variable_comb_y: 322.5        ; Y center of the comb
variable_comb_z: -0.75         ; Z when touching the comb

# General parameters
variable_comb_z_lift: 5.0     ; Nozzle lift before/after wiping
variable_comb_width: 40.0     ; Full width of the comb (mm)
variable_comb_cycles_1: 4     ; Number of cycles in the first pass
variable_comb_cycles_2: 3     ; Number of zigzags in the second pass
variable_comb_offset_y: 1.0   ; Y offset for the second pass
variable_comb_zigzag_shift: 1.5 ; X shift for each zigzag step

# Return to specified position
variable_return_x: 2.0
variable_return_y: 20.0

gcode:
    {% set half_width = comb_width / 2 %}
    {% set zigzag_shift = comb_zigzag_shift %}

    G90 ; Absolute coordinates
    G1 Z{comb_z_lift} F3000 ; Lift nozzle before moving
    G1 X{comb_x} Y{comb_y} F6000 ; Center of the comb
    G1 Z{comb_z} F3000 ; Contact with the comb

    ; First straight pass
    G91 ; Relative coordinates
    {% for i in range(comb_cycles_1) %}
        G1 X{half_width} F4500
        G1 X-{half_width * 2} F4500
        G1 X{half_width} F4500
    {% endfor %}

    ; Lift slightly and move Y offset
    G1 Z0.3 Y{comb_offset_y} F3000

    ; Second pass — zigzag along X with a slight shift
    {% for i in range(comb_cycles_2) %}
        G1 X{half_width + (zigzag_shift * i)} F4500
        G1 X-{(half_width + (zigzag_shift * i)) * 2} F4500
        G1 X{half_width + (zigzag_shift * i)} F4500
    {% endfor %}

    ; Lift and return
    G90
    G1 Z{comb_z_lift} F3000
    ;G1 X{return_x} Y{return_y} F6000
    ;G4 P500

[gcode_macro WIPE_NOZZLE]
description: Use the filament litter box 
gcode: 
  {% set wipe_count = params.COUNT|default(3)|int %}
  {% set exit_x = printer.toolhead.axis_maximum.x - 50 %}

  SAVE_GCODE_STATE NAME=wipe_nozzle_state

  {% set wipe_count = params.COUNT|default(3)|int %}
  {% set exit_x = printer.toolhead.axis_maximum.y - 50.0 %}


  ; move to the perimeter of the print bed
  G90
  G0 Z2 F2000
  G0 X{exit_x} Y{printer.toolhead.axis_maximum.y} F2000

  ; move out to the wipe box 
  FORCE_MOVE STEPPER=stepper_y DISTANCE=27 VELOCITY=30
  FORCE_MOVE STEPPER=stepper_z DISTANCE=-1.8 VELOCITY=15

  ; wipe on the roller
  {% for i in range(wipe_count) %}
    FORCE_MOVE STEPPER=stepper_x DISTANCE=35 VELOCITY=50 #85
    FORCE_MOVE STEPPER=stepper_x DISTANCE=-35 VELOCITY=50 #85
  {% endfor %}

  ; wipe on the rubber 
  {% for i in range(wipe_count) %}
  FORCE_MOVE STEPPER=stepper_x DISTANCE=-30 VELOCITY=50 #85
  FORCE_MOVE STEPPER=stepper_x DISTANCE=30 VELOCITY=50 #85
  {% endfor %}
  
  ; return to the print bed  
  FORCE_MOVE STEPPER=stepper_z DISTANCE=3.3 VELOCITY=15
  FORCE_MOVE STEPPER=stepper_y DISTANCE=-27 VELOCITY=30
  
  ; wash hands
  RESTORE_GCODE_STATE NAME=wipe_nozzle_state

[respond]
[gcode_macro G12]
description: Clean nozzle in the wipe box
gcode: 
  {% set wipe_count = params.C|default(3)|int %}
  WIPE_NOZZLE COUNT={wipe_count}

[gcode_macro update_git]
gcode:
    {% set message = params.MESSAGE|default() %}
    {% if message %}
        RUN_SHELL_COMMAND CMD=update_git_script_message PARAMS="'{params.MESSAGE}'"
    {% else %}
        RUN_SHELL_COMMAND CMD=update_git_script
    {% endif %}

[gcode_shell_command update_git_script]
command: bash -c "bash $HOME/klipper-backup/script.sh"
timeout: 90.0
verbose: True

[gcode_shell_command update_git_script_message]
command: bash -c "bash $HOME/klipper-backup/script.sh -c \"$0\""
timeout: 90.0
verbose: True





